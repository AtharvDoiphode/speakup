# Render blueprint: one free web service that serves the API and the built React app.
# Secrets are sync: false, so Render asks for them when you create the service. No values live here.
services:
  - type: web
    name: speakup
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.1-flash-lite-preview
      - key: APP_TIMEZONE
        value: Asia/Kolkata
